<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TENTIFY - Embedded Configurator Demo</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f5f7;
        color: #202124;
      }

      header {
        padding: 20px 5%;
        background: #ffffff;
        border-bottom: 1px solid #e5e7eb;
      }

      header h1 {
        margin: 0;
        font-size: 24px;
      }

      main {
        width: min(1400px, 95%);
        margin: 30px auto;
      }

      .description {
        margin-bottom: 20px;
      }

      .embed-container {
        overflow: hidden;
        background: white;
        border: 1px solid #ddd;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      }

      iframe {
        display: block;
        width: 100%;
        height: 900px;
        border: 0;
      }

      @media (max-width: 600px) {
        main {
          width: 100%;
          margin: 0;
        }

        .description {
          padding: 16px;
        }

        iframe {
          height: 1000px;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>TENTIFY Store</h1>
    </header>

    <main>
      <div class="description">
        <h2>Customize Your Promotional Tent</h2>
        <p>
          This page demonstrates the TENTIFY configurator embedded inside
          another website using an iframe.
        </p>
      </div>

      <div class="embed-container">
        <iframe
          src="https://tent-configurator-seven.vercel.app/"
          title="TENTIFY Product Configurator"
          loading="lazy"
          allow="fullscreen"
        ></iframe>
      </div>
    </main>
  </body>
</html>
